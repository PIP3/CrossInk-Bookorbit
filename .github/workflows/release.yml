name: Compile Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/crossink_version = .*/crossink_version = $VERSION/" platformio.ini
          # scripts/rename_firmware.py sanitises the version for artifact names:
          # anything outside [A-Za-z0-9._-] becomes '-'. Semver build metadata such
          # as "+bookorbit.1" therefore reaches the filename as "-bookorbit.1", so
          # the asset paths below must use the sanitised form, not $VERSION.
          ASSET_VERSION="$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9._-]\{1,\}/-/g')"
          echo "ASSET_VERSION=$ASSET_VERSION" >> "$GITHUB_ENV"

      - name: Build CrossInk
        env:
          CROSSPOINT_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pio run -e tiny -e xlarge

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            .pio/build/tiny/firmware-tiny-v${{ env.ASSET_VERSION }}.bin
            .pio/build/xlarge/firmware-xlarge-v${{ env.ASSET_VERSION }}.bin
